const QB=120;
let S={w:1,d:0,log:{},ex:{}};

const save=()=>{try{localStorage.setItem("b9",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function parse(r){r=(r||"").trim();let m;
 if(m=r.match(/^(\d+)\s*x\s*(.+)$/i))return Array(+m[1]).fill(m[2]);
 if(m=r.match(/^(\d+)\s*MAV$/i))return Array(+m[1]).fill("MAV");
 const t=r.split("-");if(t.length>=3&&t.every(x=>/^[\dA-Z|]+$/i.test(x)))return t;
 return [r]}
function rest(t){t=(t||"").trim();let m;
 if(!t||t==="QB")return QB;
 if(m=t.match(/^(\d+)''$/))return +m[1];
 if(m=t.match(/^(\d+)'(\d+)?/))return +m[1]*60+(+m[2]||0);
 return QB}
function view(e,w){const ov=(e[6]||{})[w]||[];const g=(i,b)=>ov[i]!=null?ov[i]:b;
 return{n:g(3,e[0]),r:g(0,e[1]),i:g(1,e[2]),o:g(2,e[5])}}

 (S.ses.hist||[]).forEach(h=>{last=Math.max(last,(h.w-1)*5+h.d)});

// timer
let end=0,tot=0,iv=null,ac=null;
const f=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 [0,.25,.5].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.15)})}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}}
function start(s){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
 tot=s;end=Date.now()+s*1000;clearInterval(iv);iv=setInterval(tick,250);tick()}
function tick(){const l=Math.max(0,Math.ceil((end-Date.now())/1000));

function adj(x){if(!end)return;end+=x*1000;tot=Math.max(1,tot+x);tick()}

// frequenza cardiaca in diretta via Bluetooth (Web Bluetooth)
let hrDev=null;
function hrUI(t){document.getElementById("hrBtn").textContent=t}
async function hrConnect(){
 if(!navigator.bluetooth){hrUI("♥ non supportato");return}
 try{
  const d=await navigator.bluetooth.requestDevice({filters:[{services:["heart_rate"]}]});
  hrDev=d;d.addEventListener("gattserverdisconnected",()=>hrUI("♥ Ricollega"));
